name: CI — Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile integrity
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OWASP Dependency-Check
        run: |
          DC_VERSION="11.1.1"
          wget -q "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" -O dc.zip
          unzip -q dc.zip -d /opt
          echo "/opt/dependency-check-${DC_VERSION}/bin" >> $GITHUB_PATH
          rm dc.zip

      - name: Run OWASP Dependency-Check
        run: |
          dependency-check \
            --project "connecteo-frontend" \
            --scan . \
            --format HTML \
            --format JSON \
            --out reports \
            --noupdate

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-frontend
          path: reports/
          retention-days: 30

      - name: Fail on Critical/High Vulnerabilities
        if: always()
        run: |
          if [ -f reports/dependency-check-report.json ]; then
            CRITICAL=$(python3 -c "
          import json, sys
          data = json.load(open('reports/dependency-check-report.json'))
          deps = data.get('dependencies', [])
          crits = [d for d in deps if any(
            v.get('severity') in ('CRITICAL', 'HIGH')
            for v in d.get('vulnerabilities', [])
          )]
          print(len(crits))
          " 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL dependencies with Critical/High vulnerabilities"
              exit 1
            fi
          fi
